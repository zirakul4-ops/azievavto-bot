name: Публикация авто в Telegram

on:
  schedule:
    # Время указано по UTC. Уфа = UTC+5.
    - cron: "57 4 * * *"    # ~10:00 по Уфе
    - cron: "27 7 * * *"    # ~12:30 по Уфе
    - cron: "57 9 * * *"    # ~15:00 по Уфе
    - cron: "27 12 * * *"   # ~17:30 по Уфе
    - cron: "57 14 * * *"   # ~20:00 по Уфе
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тестовый запуск: только показать пост, в канал не отправлять"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Публикация
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          MAX_PRICE: ${{ vars.MAX_PRICE }}
          MIN_PRICE: ${{ vars.MIN_PRICE }}
          MIN_YEAR: ${{ vars.MIN_YEAR }}
          BRANDS: ${{ vars.BRANDS }}
        run: python bot.py

      - name: Запомнить опубликованное
        if: always()
        run: |
          git config user.name "azievavto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Опубликован автомобиль" && git pull --rebase && git push)
