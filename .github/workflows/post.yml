name: Публикация авто в Telegram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Тестовый запуск: только показать пост, в канал не отправлять"
        type: boolean
        default: true
      count:
        description: "Сколько постов опубликовать за этот запуск"
        type: number
        default: 1

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Публикация
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@azievavto"
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: "77264988"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          MAX_PRICE: ${{ vars.MAX_PRICE }}
          MIN_PRICE: ${{ vars.MIN_PRICE }}
          MIN_YEAR: ${{ vars.MIN_YEAR }}
          BRANDS: ${{ vars.BRANDS }}
        run: |
          N="${{ inputs.count || 1 }}"
          for i in $(seq 1 "$N"); do
            python bot.py || exit 1
            if [ "$i" -lt "$N" ]; then sleep 20; fi
          done

      - name: Запомнить опубликованное
        if: always()
        run: |
          git config user.name "azievavto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json docs vk_queue.json
          git diff --cached --quiet || (git commit -m "Опубликован автомобиль" && git pull --rebase && git push)

  pages:
    needs: post
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4

  vk:
    needs: [post, pages]
    if: ${{ always() && needs.post.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Публикация во ВКонтакте
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: "77264988"
          PAGES_OK: ${{ needs.pages.result == 'success' }}
        run: python vk.py flush
      - name: Сохранить очередь ВК
        if: always()
        run: |
          git config user.name "azievavto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add vk_queue.json
          git diff --cached --quiet || (git commit -m "Посты отправлены во ВКонтакте" && git pull --rebase && git push)
